name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare project-local artifact directories
        run: mkdir -p TMP/cargo-home TMP/target
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Release build
        run: cargo build --locked --release
    env:
      TMPDIR: ${{ github.workspace }}/TMP
      CARGO_HOME: ${{ github.workspace }}/TMP/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/TMP/target

